<section *ngIf="project">

  <h1>{{ project.title }}</h1>

  <p>{{ project.description }}</p>

  <div class="info">
    <h3>Role</h3>
    <p>{{ project.role }}</p>

    <h3>Tech Stack</h3>
    <p>{{ project.tech }}</p>

    <h3>Project Details</h3>
    <p>{{ project.details }}</p>
  </div>

  <a routerLink="/projects" class="btn">← Back to Projects</a>

</section>
