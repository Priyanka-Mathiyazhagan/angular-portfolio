<section class="projects">

  <h1>My Projects</h1>

  <div class="project-grid">

    <div class="project-card" *ngFor="let project of projects">

      <h2>{{ project.title }}</h2>

      <p>{{ project.description }}</p>

      <p><b>Tech:</b> {{ project.tech }}</p>

      <a class="btn"
         [routerLink]="['/projects', project.id]">
        Know more
      </a>

    </div>

  </div>

</section>
